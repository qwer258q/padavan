name: build

on: 
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          sudo apt update
          sudo apt install -y libtool-bin gperf python3-docutils autopoint gettext ccache build-essential

      - name: Build Toolchain
        run: |
          # 编译工具链，这是将 PC 代码转为 K2P 代码的翻译官
          cd toolchain-mipsel
          ./clean_toolchain
          ./build_toolchain

      - name: Build Firmware
        run: |
          cd trunk
          # 确保配置文件存在
          cp configs/templates/K2P.config .config
          # 强制指定编译器路径并编译
          # 如果报错，说明你的源码需要指定编译器路径，通常是下面这个
          export PATH=$PATH:/opt/build_mipsel/toolchain-mipsel/bin
          make K2P

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-Firmware
          path: trunk/images/*.trx
