name: build

on: 
  push:
    branches:
    - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [K2P]
        toolchain: [mipsel-linux-musl]
    steps:
      - uses: actions/checkout@v4 # 顺便更新到 v4

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@v5 # 更新到 v5
        with:
          go-version: '1.20'
          check-latest: true
          cache: false

      - uses: actions/setup-node@v4 # 更新到 v4
        with:
          node-version: 18
          check-latest: true

      - name: Prepare
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext ccache

      - name: Configure and Patch
        run: |
          # 覆盖配置文件到源码目录
          cp -f K2P.config trunk/configs/templates/${{ matrix.target }}.config
          
          # 强制禁用 htop 插件，防止编译中断
          cd trunk
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_HTOP=y/CONFIG_FIRMWARE_INCLUDE_HTOP=n/' .config || true
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_HTOP=y/CONFIG_FIRMWARE_INCLUDE_HTOP=n/' configs/templates/${{ matrix.target }}.config
          echo "CONFIG_FIRMWARE_INCLUDE_HTOP=n" >> .config

      - name: Build
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

      - name: Rename Image
        run: |
          cd trunk/images
          for img in *.trx; do
            mv "$img" "${{ matrix.target }}_$(date +%Y%m%d)_$img"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # 关键点：升级到 v4
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}
          path: trunk/images/*.trx

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifact
        uses: actions/download-artifact@v4 # 关键点：升级到 v4
        with:
          name: K2P-mipsel-linux-musl # 显式指定要下载的 artifact 名称

      - name: Set Tag Name
        run: echo "TAG_NAME=$(date +%Y%m%d)" >> $GITHUB_ENV

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ env.TAG_NAME }}
          force_push_tag: true

      - uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.TAG_NAME }}
          artifacts: "*.trx" # v4 下载后文件直接在当前目录或指定目录
          allowUpdates: true
