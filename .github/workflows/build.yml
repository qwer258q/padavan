name: build

on: 
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          sudo apt update
          sudo apt install -y libtool-bin gperf python3-docutils autopoint gettext ccache

      - name: Build Firmware
        run: |
          cd trunk
          # 直接编译 K2P，系统会自动读取 configs/templates/K2P.config
          make K2P

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-Firmware
          path: trunk/images/*.trx
