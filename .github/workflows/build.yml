name: build

on: 
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          sudo apt update
          sudo apt install -y libtool-bin gperf python3-docutils autopoint gettext ccache

      - name: Build Firmware
        run: |
          cd trunk
          # 1. 绝招：手动将模板复制为 .config
          cp configs/templates/K2P.config .config
          # 2. 直接执行 make，系统会自动读取 .config 进行编译
          make

      - name: Upload Firmware
        # 升级为 v4 版本，解决 Deprecation 报错
        uses: actions/upload-artifact@v4
        with:
          name: K2P-Firmware
          path: trunk/images/*.trx
